const short=s=>s?D(s).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'no date';
const cd=s=>{const n=diff(s);return n<0?`${-n}d ago`:n==0?'today':`in ${n}d`};
function ev(e){return `<div class="row"><span class="dot" style="--c:${col(e.tag)}"></span><span><b>${esc(e.name)}</b><br><span class="mut">${short(e.start)}${e.end&&e.end!=e.start?'–'+short(e.end):''} · ${esc(e.tag)}</span></span>${/Needs/.test(e.verif||'')?'<span class="pill v">verify</span>':''}<span class="mut">${cd(e.start)}</span></div>`}
function today(){const up=S.events.filter(e=>(e.end||e.start)>=TODAY&&e.status!='Canceled').sort((a,b)=>a.start<b.start?-1:1);
const hard=up.find(e=>e.tag=='Hard Deadline'),h14=up.filter(e=>e.tag=='Hard Deadline'&&diff(e.start)<=14).length;
const tk=S.reqs.filter(open).sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1),od=tk.filter(r=>r.due&&r.due<TODAY).length,red=S.apps.filter(a=>health(a)[0]=='🔴').length;
return `<div class="stats"><div class="st r"><b>${h14}</b>hard deadlines in 14 days</div><div class="st a"><b>${red}</b>colleges need action</div><div class="st"><b>${tk.length}</b>open tasks</div><div class="st ${od?'r':''}"><b>${od}</b>overdue tasks</div></div>
${hard?`<div class="next"><div class="big">${diff(hard.start)}</div><div>days until your next hard deadline<br><b style="font-size:18px">${esc(hard.name)}</b><br><span style="color:#c9d3e3">${short(hard.start)}${/Needs/.test(hard.verif||'')?' · confirm this date':''}</span></div></div>`:''}
<div class="grid2"><div class="box"><h2>Coming up</h2>${up.slice(0,8).map(ev).join('')||'<p class="mut">No upcoming events. Add one on the Calendar tab.</p>'}</div>
<div class="box"><h2>Open tasks</h2>${tk.slice(0,8).map(r=>`<div class="row"><span><b>${esc(r.name)}</b><br><span class="mut">${esc(r.college||'All colleges')} · ${esc(r.owner)} · ${esc(r.status)}</span></span><span class="mut">${r.due?cd(r.due):''}</span></div>`).join('')||'<p class="mut">Nothing open.</p>'}</div></div>`}
function calendar(){const y=cur.getFullYear(),m=cur.getMonth(),st=new Date(y,m,1-new Date(y,m,1).getDay());let g=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="h">${d}</div>`).join('');
for(let i=0;i<42;i++){const d=new Date(st);d.setDate(st.getDate()+i);const k=iso(d),es=S.events.filter(e=>evOn(e,k));
g+=`<div class="${d.getMonth()!=m?'o ':''}${k==TODAY?'t ':''}${k==sel?'s':''}" onclick="sel='${k}';render()"><b>${d.getDate()}</b>${es.slice(0,3).map(e=>`<div class="ch" style="--c:${col(e.tag)}">${esc(e.name)}</div>`).join('')}${es.length>3?`<div class="mut">+${es.length-3} more</div>`:''}</div>`}
const day=S.events.filter(e=>inR(e,sel));
return `<div class="cal"><div><div class="bar" style="margin:0 0 10px"><button onclick="cur.setMonth(cur.getMonth()-1);render()">‹</button><h2 style="margin:0;flex:1;text-align:center">${cur.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h2><button onclick="cur.setMonth(cur.getMonth()+1);render()">›</button></div><div class="mg">${g}</div>
<p class="mut">${Object.entries({'Hard deadline':'#c8372d','Apply-free / merit':'#b7791f','Fair / info':'#6b46c1','Action / aid':'#2b6cb0','Travel / visit':'#2f855a'}).map(([n,c])=>`<span class="dot" style="--c:${c};display:inline-block"></span> ${n} &nbsp;`).join('')}</p></div>
<div class="box"><h2>${D(sel).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</h2>${day.map(e=>`<div class="row"><span class="dot" style="--c:${col(e.tag)}"></span><span><b>${esc(e.name)}</b><br><span class="mut">${esc(e.tag)} · ${esc(e.status)}</span></span><button onclick="editEv('${e.id}')">Edit</button></div>`).join('')||'<p class="mut">Nothing scheduled.</p>'}<div class="bar"><button class="p" onclick="editEv()">Add event</button></div></div></div>`}
function colleges(){return `<div class="bar" style="margin:0 0 12px"><h2 style="margin:0;flex:1">Colleges</h2><button class="p" onclick="editApp()">Add college</button></div>`+S.apps.map(a=>{const[h,t]=health(a);return `<div class="ap"><div class="row" style="border:0;padding:0"><span class="hd">${h}</span><span><b style="font-size:17px">${esc(a.name)}</b><br><span class="mut">${esc(a.type)} · deadline ${short(a.deadline)}${a.deadline?' ('+cd(a.deadline)+')':''} · ${t}, ${missing(a)} open</span></span><button onclick="editApp('${a.id}')">Edit</button></div>
${a.next?`<p class="mut" style="margin:8px 0 0">Next: ${esc(a.next)}${a.nextDue?' by '+short(a.nextDue):''}</p>`:''}
<div class="fl"><div><label>Status</label><select onchange="upd('apps','${a.id}','status',this.value)">${opts(STAT,a.status)}</select></div>${F.map(([k,l,o])=>`<div><label>${l}</label><select onchange="upd('apps','${a.id}','${k}',this.value)">${opts(o,a[k])}</select></div>`).join('')}</div></div>`}).join('')}
function tasks(){return `<div class="bar" style="margin:0 0 12px"><h2 style="margin:0;flex:1">Tasks & requirements</h2><button class="p" onclick="editReq()">Add task</button></div><table><tr><th>Task</th><th>College</th><th>Owner</th><th>Due</th><th>Status</th><th></th></tr>${[...S.reqs].sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1).map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.college||'All')}</td><td>${esc(r.owner)}</td><td class="${r.due&&r.due<TODAY&&open(r)?'':'mut'}" style="${r.due&&r.due<TODAY&&open(r)?'color:var(--red);font-weight:600':''}">${short(r.due)}</td><td><select onchange="upd('reqs','${r.id}','status',this.value)">${opts(RST,r.status)}</select></td><td><button onclick="editReq('${r.id}')">Edit</button></td></tr>`).join('')}</table>`}
function form(title,fields,o,ok,del){const dl=$('#dlg');dl.innerHTML=`<form method="dialog"><h2>${title}</h2>${fields.map(([k,l,t,os])=>`<label>${l}${t=='s'?`<select name="${k}">${opts(os,o[k])}</select>`:t=='ta'?`<textarea name="${k}" rows="6" style="width:100%;padding:6px;font:inherit">${esc(o[k]||'')}</textarea>`:`<input name="${k}" type="${t}" value="${esc(o[k]||'')}">`}</label>`).join('')}<div class="bar"><button class="p" value="ok">Save</button><button value="x">Cancel</button>${del?'<button type="button" class="d" id="del">Delete</button>':''}</div></form>`;
dl.onclose=()=>{if(dl.returnValue=='ok'){const f=new FormData(dl.querySelector('form'));fields.forEach(([k])=>o[k]=f.get(k));ok(o);save();render()}dl.returnValue=''};
if(del)$('#del').onclick=()=>{if(confirm('Delete this item?')){del();save();dl.close('x');render()}};dl.showModal()}
function editEv(id){const n=!id,o=n?{id:uid('EVT','events'),tag:'Logistics & Action',status:'Planned',verif:'Needs Verification',start:sel,owner:'Student'}:S.events.find(e=>e.id==id);
form(n?'Add event':'Edit event',[['name','Event','text'],['tag','Type','s',Object.keys(TAGS)],['start','Start date','date'],['end','End date (optional)','date'],['owner','Owner','s',OWN],['status','Status','s',ML('Planned,Registered,In Progress,Done,Canceled')],['verif','Date check','s',VER],['loc','Location / link','text']],o,x=>{if(n)S.events.push(x)},n?0:()=>S.events=S.events.filter(e=>e.id!=id))}
function editApp(id){const n=!id,o=n?{id:uid('APP','apps'),type:'Regular Decision',status:'Researching',transcript:'Not Started',essay1:'Draft',essay2:'Not Required',counselorRec:'Not Started',teacherRec:'Not Required',fafsaContrib:'To Invite',fafsaSubmitted:'Not Started',aidPortal:'Needs Setup',fee:'Unpaid'}:S.apps.find(a=>a.id==id);
form(n?'Add college':'Edit college',[['name','College','text'],['type','Application type','s',TYPES],['deadline','Deadline','date'],['target','Your target date','date'],['next','Next action (one sentence)','text'],['nextDue','Next action due','date'],['notes','Missing-items notes','text']],o,x=>{if(n)S.apps.push(x)},n?0:()=>S.apps=S.apps.filter(a=>a.id!=id))}
function editReq(id){const n=!id,o=n?{id:uid('REQ','reqs'),status:'Not Started',owner:'Student',college:'All colleges',cat:'Application'}:S.reqs.find(r=>r.id==id);
form(n?'Add task':'Edit task',[['name','Task','text'],['college','College','text'],['owner','Owner','s',OWN],['due','Due date','date'],['status','Status','s',RST]],o,x=>{if(n)S.reqs.push(x)},n?0:()=>S.reqs=S.reqs.filter(r=>r.id!=id))}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='college-dashboard-'+TODAY+'.json';a.click()}
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.events||!d.apps||!d.reqs)throw 0;S=d;save();render()}catch(x){alert('That file is not a dashboard export.')}})};
function rst(){if(confirm('Replace all your changes with the original sample data?')){S=structuredClone(SEED);save();render()}}
function inbox(){
  if(!LIVE) return `<div class="box"><h2>Inbox</h2><p class="mut">Forwarded college emails need shared live sync turned on first &mdash; they need somewhere live to land. Set that up (see README), then come back here.</p></div>`;
  const rows=inboxRows;
  return `<div class="bar" style="margin:0 0 12px"><h2 style="margin:0;flex:1">Inbox${rows.filter(r=>r.status=='new').length?` (${rows.filter(r=>r.status=='new').length} new)`:''}</h2><button class="p" onclick="addInboxManual()">Paste an email</button></div>
  ${rows.length?rows.map(r=>`<div class="ap"><div class="row" style="border:0;padding:0"><span class="pill${r.status=='new'?' v':''}" style="flex:none">${esc(r.status)}</span><span><b>${esc(r.subject||'(no subject)')}</b><br><span class="mut">${esc(r.from_email||'unknown sender')} · ${esc(r.college||'no college tagged')} · ${short(r.received_at?String(r.received_at).slice(0,10):null)}</span></span></div>
  <details style="margin-top:8px"><summary class="mut" style="cursor:pointer">Show full email</summary><pre style="white-space:pre-wrap;font-family:inherit;font-size:13px;margin:8px 0 0">${esc(r.body||'')}</pre></details>
  ${r.status!='archived'&&r.status!='promoted'?`<div class="bar"><button onclick="inboxToTask('${r.id}')">Make task</button><button onclick="inboxToEvent('${r.id}')">Make event</button><button onclick="dismissInbox('${r.id}')">Dismiss</button></div>`:''}</div>`).join(''):'<p class="mut">No emails yet. Forward one to your dedicated address, or paste one in to try it now.</p>'}`
}
function render(){$('#nav').innerHTML=[['today','Today'],['cal','Calendar'],['col','Colleges'],['task','Tasks'],['inbox','Inbox'+(LIVE&&inboxRows.filter(r=>r.status=='new').length?` (${inboxRows.filter(r=>r.status=='new').length})`:'')]].map(([k,l])=>`<button class="${view==k?'on':''}" onclick="view='${k}';render()">${l}</button>`).join('');$('#m').innerHTML={today,cal:calendar,col:colleges,task:tasks,inbox}[view]()}
render();
</script></body></html>
